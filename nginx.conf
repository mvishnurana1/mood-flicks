server {
    listen 80;
    listen [::]:80;
    server_name movies.vishnurana.app;

    root /var/www/moodflicks;
    index index.html;

    location /API/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_read_timeout 20s;
    }

    location /static/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
